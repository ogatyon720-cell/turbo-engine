<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>おせわ | きゅうきゅうザウルス</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">きょうりゅうの おせわ</div>
    <div id="testBadge" class="test-badge" hidden>🧪 テストモード：回数を消費しません</div>

    <section class="card hero">
      <div id="creature" class="creature dino-sprite" aria-label="きょうりゅう"></div>
      <div id="name" class="stage-name">ふしぎな たまご</div>
      <p id="reaction" class="message">きょうは なにをしてあげる？</p>
      <div class="notice">おせわできる回数：<strong id="tokens">0</strong><span id="tokenSuffix"> 回</span></div>
    </section>

    <section class="card">
      <div class="grid-4">
        <button class="care-btn" data-care="food"><span class="emoji">🍖</span><span>ごはん</span></button>
        <button class="care-btn" data-care="pet"><span class="emoji">💕</span><span>なでなで</span></button>
        <button class="care-btn" data-care="play"><span class="emoji">⚽</span><span>あそぶ</span></button>
        <button class="care-btn" data-care="sleep"><span class="emoji">💤</span><span>ねる</span></button>
      </div>
      <button id="normalView" class="secondary" type="button">通常の姿にもどす</button>
      <a id="homeLink" class="secondary" href="index.html">← おうちにもどる</a>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="assets.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const isTest = params.get('test') === '1';
    const testPointsRaw = Number(params.get('points'));
    const testPoints = Number.isFinite(testPointsRaw) ? Math.max(0, testPointsRaw) : GameStore.getState().growthPoints;
    let activeCare = null;

    const careToScene = { food: 'feed', pet: 'pet', play: 'play', sleep: 'sleep' };
    const reactions = {
      food: ['もぐもぐ……おいしい！', 'おなかいっぱい！ うれしそう。', 'もっと おおきくなれそう！'],
      pet: ['きもちよさそうに 目をほそめている。', 'もっと なでてほしそう！', 'ぴったり くっついてきた！'],
      play: ['わーい！ げんきいっぱい！', 'たのしそうに かけまわった！', 'もういっかい！ と言っているみたい。'],
      sleep: ['すやすや……いいゆめ みてね。', 'ぐっすり ねむっているよ。', 'きょうも よくがんばったね。']
    };

    function viewState() {
      const state = GameStore.getState();
      return isTest ? { ...state, growthPoints: testPoints } : state;
    }

    async function render(message) {
      const state = viewState();
      const actual = GameStore.getState();
      const stage = GameLogic.stageForPoints(state.growthPoints);
      const canShowCareArt = isTest || stage.asset === 'stage_05_small';
      const scene = activeCare ? careToScene[activeCare] : null;
      const asset = scene && canShowCareArt ? GameLogic.ACTION_ASSETS[scene] : stage.asset;
      await GameAssets.show(document.getElementById('creature'), asset);

      document.getElementById('name').textContent = state.dinosaurName || stage.name;
      if (message) {
        document.getElementById('reaction').textContent = message;
      } else if (!isTest && actual.careTokens <= 0) {
        document.getElementById('reaction').textContent = '九九プリントをすると、おせわが1回できるよ。';
      } else {
        document.getElementById('reaction').textContent = 'きょうは なにをしてあげる？';
      }

      if (isTest) {
        document.getElementById('testBadge').hidden = false;
        document.getElementById('tokens').textContent = '∞';
        document.getElementById('tokenSuffix').textContent = '（テスト）';
        document.getElementById('homeLink').href = 'index.html?test=1';
      } else {
        document.getElementById('tokens').textContent = actual.careTokens;
        document.getElementById('tokenSuffix').textContent = ' 回';
      }
      document.querySelectorAll('[data-care]').forEach(btn => btn.disabled = !isTest && actual.careTokens <= 0);
    }

    document.querySelectorAll('[data-care]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.care;
        activeCare = type;
        const options = reactions[type];
        const message = options[Math.floor(Math.random() * options.length)];

        if (isTest) {
          render(message);
          return;
        }

        const before = GameStore.getState();
        const beforeStage = GameLogic.stageForPoints(before.growthPoints);
        const result = GameStore.useCare(type);
        if (!result.success) {
          activeCare = null;
          render();
          return;
        }
        if (beforeStage.asset !== 'stage_05_small') {
          render(before.growthPoints < 50 ? 'たまごを そっと おせわしたよ。なかで うれしそうに うごいた！' : `${message} この成長段階の専用アニメはこれから追加予定だよ。`);
        } else {
          render(message);
        }
      });
    });

    document.getElementById('normalView').addEventListener('click', () => {
      activeCare = null;
      render();
    });

    render();
  </script>
</body>
</html>
