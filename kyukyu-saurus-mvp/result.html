<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>こたえあわせ | きゅうきゅうザウルス</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="brand">こたえあわせ 🦖</div>
    <section class="card">
      <div id="duplicate" class="notice" hidden>このプリントは、もう成長に登録してあるよ。</div>
      <form id="resultForm">
        <div class="field">
          <label for="correct">なんもん せいかいした？</label>
          <input id="correct" type="number" min="0" max="30" inputmode="numeric" required placeholder="0〜30" />
        </div>
        <div class="field" style="margin-top:16px">
          <label for="minutes">なんぷん かかった？ <span class="small">（書かなくてもOK）</span></label>
          <input id="minutes" type="number" min="1" max="120" inputmode="numeric" placeholder="例：9" />
        </div>
        <div id="preview" class="notice">プリントを最後までやったら、まず10せいちょう！ 正解数でボーナスもあるよ。</div>
        <button class="primary" type="submit">🌱 きょうりゅうを そだてる</button>
      </form>
      <a class="secondary" href="index.html">ホームにもどる</a>
      <p class="small">※ まちがいがあっても大丈夫。最後まで取り組んだことがいちばん大事なので、基本10ポイントは必ずつきます。</p>
    </section>
  </main>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script>
    const wid = new URLSearchParams(location.search).get('wid') || '';
    const state = GameStore.getState();
    const already = wid && state.completedWorksheetIds.includes(wid);
    if (!wid || already) {
      document.getElementById('duplicate').hidden = false;
      document.getElementById('resultForm').hidden = true;
      if (!wid) document.getElementById('duplicate').textContent = 'プリントIDが見つかりません。印刷したプリントのQRから開いてください。';
    }

    const correct = document.getElementById('correct');
    correct.addEventListener('input', () => {
      const n = Number(correct.value);
      if (Number.isFinite(n) && n >= 0 && n <= 30) {
        const bonus = GameLogic.bonusForCorrect(n);
        const total = GameLogic.pointsForWorksheet(n);
        document.getElementById('preview').textContent = `🌱 10せいちょう + ボーナス ${bonus} = ${total}せいちょう！`;
      }
    });

    document.getElementById('resultForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const n = Number(correct.value);
      if (!Number.isInteger(n) || n < 0 || n > 30) return;
      const minutes = document.getElementById('minutes').value;
      const result = GameStore.registerWorksheet({ worksheetId: wid, correct: n, minutes });
      if (result.duplicate) {
        alert('このプリントは登録済みです。');
        return;
      }
      location.href = `index.html?gained=${result.addedPoints}`;
    });
  </script>
</body>
</html>
